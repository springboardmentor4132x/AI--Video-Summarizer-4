<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipMind AI</title>
    <script>
      // Apply the saved theme (or the OS preference) before first paint so a
      // refresh never flashes the wrong theme. Keep in sync with src/theme.js.
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("clipmind-theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
